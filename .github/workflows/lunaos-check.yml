name: LunaOS migration reference checks

on:
  push:
    branches: [quattro, mont-blanc, 'codex/**']
    paths:
      - 'lunaos/**'
      - '.github/workflows/lunaos-check.yml'
  pull_request:
    paths:
      - 'lunaos/**'
      - '.github/workflows/lunaos-check.yml'

permissions:
  contents: read

jobs:
  portable:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    defaults:
      run:
        working-directory: lunaos
    steps:
      - uses: actions/checkout@v7
        with:
          persist-credentials: false
      - uses: actions/setup-go@v6
        with:
          go-version: '1.20.x'
          cache: false
      - uses: actions/setup-python@v6
        with:
          python-version: '3.11'
      - name: Frozen reference unit and integration checks
        run: make test-reference check-reference
      - name: Policy broker race check
        run: go test -buildvcs=false -race -count=1 ./services/policy

  native-rust:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    defaults:
      run:
        working-directory: lunaos/rust
    steps:
      - uses: actions/checkout@v7
        with:
          persist-credentials: false
      - uses: dtolnay/rust-toolchain@stable
      - name: Test native workspace without Python
        run: cargo test --workspace --locked
      - name: Build portable Luna Core
        run: cargo build --locked --release -p luna-core
