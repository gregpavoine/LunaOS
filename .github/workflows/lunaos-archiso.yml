name: LunaOS Arch ISO

on:
  workflow_dispatch:
  push:
    branches: [mont-blanc, feature/standalone-installable-iso, feature/installer-vm-acceptance]
    paths:
      - 'lunaos/**'
      - '.github/workflows/lunaos-archiso.yml'

permissions:
  contents: read

jobs:
  archiso:
    runs-on: ubuntu-24.04
    timeout-minutes: 120
    permissions:
      contents: read
    steps:
      - uses: actions/checkout@v7
        with:
          persist-credentials: false

      - name: Start isolated Arch build container
        shell: bash
        run: |
          set -euo pipefail
          output_dir="$RUNNER_TEMP/lunaos-archiso-output"
          container_name="lunaos-archiso-${GITHUB_RUN_ID}-${GITHUB_RUN_ATTEMPT}"
          mkdir -p "$output_dir"
          printf 'LUNAOS_ARCHISO_OUTPUT=%s\n' "$output_dir" >> "$GITHUB_ENV"
          printf 'LUNAOS_ARCHISO_CONTAINER=%s\n' "$container_name" >> "$GITHUB_ENV"
          docker run --detach --name "$container_name" --privileged \
            --mount "type=bind,source=$GITHUB_WORKSPACE,target=/workspace,readonly" \
            --mount "type=bind,source=$output_dir,target=/output" \
            archlinux:base-devel sleep infinity

      - name: Install Arch ISO and VM test tools
        shell: bash
        run: |
          set -euo pipefail
          docker exec "$LUNAOS_ARCHISO_CONTAINER" bash -euo pipefail -c '
            pacman -Syu --noconfirm --needed archiso go sqlite sudo qemu-system-x86 qemu-img edk2-ovmf procps-ng jq expect xorriso
          '

      - name: Build standalone Arch ISO
        shell: bash
        run: |
          set -euo pipefail
          docker exec \
            -e LUNAOS_ISO_OUTPUT=/output \
            -e LUNAOS_ISO_WORK=/tmp/lunaos-archiso-work \
            "$LUNAOS_ARCHISO_CONTAINER" \
            bash -euo pipefail -c '/workspace/lunaos/scripts/build-archiso.sh'

      - name: Verify one release-sized ISO and checksum
        shell: bash
        run: |
          set -euo pipefail
          shopt -s nullglob
          iso_files=("$LUNAOS_ARCHISO_OUTPUT"/*.iso)
          if ((${#iso_files[@]} != 1)); then
            printf 'Expected exactly one ISO, found %s.\n' "${#iso_files[@]}" >&2
            exit 1
          fi
          iso_path=${iso_files[0]}
          printf 'LUNAOS_ISO_FILENAME=%s\n' "$(basename "$iso_path")" >> "$GITHUB_ENV"
          iso_size=$(stat -c '%s' "$iso_path")
          max_release_asset_size=1900000000
          if (( iso_size >= max_release_asset_size )); then
            printf 'ISO is %s bytes; maximum for a single release asset is %s bytes.\n' \
              "$iso_size" "$max_release_asset_size" >&2
            exit 1
          fi
          (cd "$LUNAOS_ARCHISO_OUTPUT" && sha256sum "$(basename "$iso_path")" > SHA256SUMS)
          cat "$LUNAOS_ARCHISO_OUTPUT/SHA256SUMS"
          ls -lh "$iso_path" "$LUNAOS_ARCHISO_OUTPUT/SHA256SUMS"

      - name: Verify UEFI live boot
        shell: bash
        run: |
          set -euo pipefail
          docker exec -e LUNAOS_ISO_PATH="/output/$LUNAOS_ISO_FILENAME" \
            "$LUNAOS_ARCHISO_CONTAINER" \
            bash -euo pipefail -c '/workspace/lunaos/scripts/test-iso-boot.sh "$LUNAOS_ISO_PATH"'

      - name: Install to a disposable VM and verify installed services and goal evidence
        shell: bash
        run: |
          set -euo pipefail
          docker exec \
            -e LUNAOS_KEEP_INSTALL_LOGS=1 \
            -e LUNAOS_INSTALL_LOG_DEST=/output/lunaos-install.log \
            -e LUNAOS_ISO_PATH="/output/$LUNAOS_ISO_FILENAME" \
            "$LUNAOS_ARCHISO_CONTAINER" \
            bash -euo pipefail -c '/workspace/lunaos/scripts/test-iso-install.sh "$LUNAOS_ISO_PATH"'

      - uses: actions/upload-artifact@v6
        with:
          name: lunaos-0.1.1-rc.2-x86_64-iso
          path: |
            ${{ runner.temp }}/lunaos-archiso-output/lunaos-0.1.1-x86_64.iso
            ${{ runner.temp }}/lunaos-archiso-output/SHA256SUMS
          if-no-files-found: error
          retention-days: 14

      - name: Upload install VM diagnostics on failure
        if: failure()
        uses: actions/upload-artifact@v6
        with:
          name: lunaos-0.1.1-rc.2-install-vm-diagnostics
          path: ${{ runner.temp }}/lunaos-archiso-output/lunaos-install.log
          if-no-files-found: warn
          retention-days: 7

      - name: Stop isolated Arch build container
        if: always()
        shell: bash
        run: |
          set -euo pipefail
          if [[ -n ${LUNAOS_ARCHISO_CONTAINER:-} ]]; then
            docker rm --force "$LUNAOS_ARCHISO_CONTAINER" >/dev/null 2>&1 || true
          fi
