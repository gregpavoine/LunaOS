[workspace]
resolver = "2"
members = [
  "crates/luna-contracts",
  "crates/luna-policy-broker",
  "crates/luna-agent-runner",
  "crates/luna-identity",
  "crates/luna-goal-engine",
  "crates/luna-core",
  "crates/luna-llm-adapter",
  "crates/luna-shell",
]

[workspace.package]
version = "0.1.0"
edition = "2024"
license = "LicenseRef-LunaOS-Owner-Review"
rust-version = "1.85"

[workspace.dependencies]
anyhow = "1.0"
axum = { version = "0.8", features = ["json"] }
libc = "0.2"
gtk = { package = "gtk4", version = "0.10" }
hex = "0.4"
hmac = "0.12"
reqwest = { version = "0.12", default-features = false, features = ["json", "rustls-tls"] }
rusqlite = { version = "0.32", features = ["bundled"] }
serde = { version = "1.0", features = ["derive"] }
serde_json = "1.0"
sha2 = "0.10"
subtle = "2.6"
thiserror = "2.0"
tokio = { version = "1.47", features = ["macros", "rt-multi-thread", "net", "io-util", "signal", "sync", "time"] }
tower = { version = "0.5", features = ["util"] }
uuid = { version = "1.18", features = ["v4", "serde"] }
luna-agent-runner = { path = "crates/luna-agent-runner" }
luna-identity = { path = "crates/luna-identity" }
