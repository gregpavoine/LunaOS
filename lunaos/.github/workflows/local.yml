name: Portable local slice
on: [push, pull_request]
permissions:
  contents: read
jobs:
  portable:
    strategy:
      matrix:
        os: [ubuntu-latest, macos-latest]
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-go@v5
        with:
          go-version: '1.20.6'
          cache: false
      - uses: actions/setup-python@v5
        with:
          python-version: '3.11.7'
      - run: make test check
      - run: go test -buildvcs=false -race -count=1 ./services/policy
