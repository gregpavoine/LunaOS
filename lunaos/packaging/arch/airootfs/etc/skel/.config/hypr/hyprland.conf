monitor = , preferred, auto, 1
$mod = SUPER
exec-once = qs -p /usr/share/lunaos/shell/shell.qml
bind = $mod, SPACE, exec, qs -p /usr/share/lunaos/shell/shell.qml ipc call luna toggleDashboard
bind = $mod SHIFT, Q, exit,

input {
  kb_layout = us
  follow_mouse = 1
}

general {
  gaps_in = 5
  gaps_out = 10
  border_size = 2
  col.active_border = rgba(d1a86bff)
  col.inactive_border = rgba(2b3039ff)
  layout = dwindle
}

decoration {
  rounding = 12
  active_opacity = 0.97
  inactive_opacity = 0.92
}

animations {
  enabled = yes
}

$terminal = foot
bind = $mod, RETURN, exec, $terminal
